        // --- GEMINI SERVICE ---
        const API_KEY = process.env.API_KEY;
        if (!API_KEY) {
            state.error = "API_KEY is not configured. This app cannot function without it.";
            console.error("API_KEY environment variable not set");
        }
        const ai = new GoogleGenAI({ apiKey: API_KEY });

        const parseDataUrl = (dataUrl) => {
            const match = dataUrl.match(/^data:(image\/(?:jpeg|png|webp));base64,(.*)$/);
            return match && match[1] && match[2] ? { mimeType: match[1], data: match[2] } : null;
        };

        const generatePortrait = async (faceImageDataUrl, hoodieImageDataUrl, customPrompt) => {
            if (!API_KEY) {
                return Promise.reject("API_KEY is not configured.");
            }
            try {
                const faceImageDetails = parseDataUrl(faceImageDataUrl);
                const hoodieImageDetails = parseDataUrl(hoodieImageDataUrl);

                if (!faceImageDetails) throw new Error("Invalid face image format.");
                if (!hoodieImageDetails) throw new Error("Invalid hoodie image format.");

                const faceImagePart = { inlineData: { mimeType: faceImageDetails.mimeType, data: faceImageDetails.data } };
                const hoodieImagePart = { inlineData: { mimeType: hoodieImageDetails.mimeType, data: hoodieImageDetails.data } };
                const textPrompt = `Using the person's face from the first image and the hoodie from the second image, generate a photorealistic, professional headshot suitable for a corporate profile. The final image should seamlessly blend the person's face onto a body wearing the hoodie, maintaining a natural look and proportions. The background should be a simple, modern, slightly out-of-focus office setting. The lighting should be professional and flattering. ${customPrompt}`;
                const textPart = { text: textPrompt };
                
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash-image',
                    contents: { parts: [faceImagePart, hoodieImagePart, textPart] },
                    config: { responseModalities: [Modality.IMAGE] },
                });

                for (const part of response.candidates[0].content.parts) {
                    if (part.inlineData) {
                        return `data:image/png;base64,${part.inlineData.data}`;
                    }
                }
                throw new Error('No image was generated by the API.');
            } catch (error) {
                console.error("Error generating portrait with Gemini:", error);
                return Promise.reject(error.message || "An unknown error occurred during image generation.");
            }
        };

        // --- IMAGE RESIZER UTILITY ---
        const imageResizer = (base64Str, maxWidth, maxHeight) => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    let { width, height } = img;
                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return reject(new Error('Could not get canvas context'));
                    ctx.drawImage(img, 0, 0, width, height);
                    const mimeType = base64Str.startsWith('data:image/jpeg') ? 'image/jpeg' : 'image/png';
                    resolve(canvas.toDataURL(mimeType, 0.9));
                };
                img.onerror = reject;
            });
        };

                        <h3 class="mt-4 text-xl font-semibold text-gray-300">Your Portrait Awaits</h3>
                        <p class="mt-1">Follow the steps to create your new profile picture.</p>
                    </div>`;
            };
            return `<div class="w-full aspect-square bg-gray-900/50 border-2 border-gray-700 rounded-lg flex items-center justify-center p-4">${content()}</div>`;
        };
        
        const Instructions = () => {
            const Step = ({ number, title, description }) => `
                <div class="flex items-start space-x-4">
                    <div class="flex-shrink-0 w-8 h-8 bg-brand-green rounded-full flex items-center justify-center font-bold text-white">${number}</div>
                    <div>
                        <h3 class="text-lg font-semibold text-white">${title}</h3>
                        <p class="text-gray-400">${description}</p>
                    </div>
                </div>`;
            return `
                <div class="bg-gray-800/50 p-6 rounded-lg border border-gray-700">
                    <h2 class="text-xl font-bold text-white mb-4">How it works</h2>
                    <div class="space-y-4">
                        ${Step({ number: 1, title: "Upload Your Photo", description: "Choose a clear, front-facing photo of your face. Good lighting works best!" })}
                        ${Step({ number: 2, title: "Choose Your Hoodie", description: "Select your favorite color: green, white, or black." })}
                        ${Step({ number: 3, title: "Add Custom Edits", description: "Use the text prompt to make small adjustments like 'add glasses' or 'change background to a library'." })}
                        ${Step({ number: 4, title: "Generate & Download", description: "Click generate, wait for the magic, and download your new professional portrait." })}
                    </div>
                </div>`;
        };

        const SetupModal = () => {
            const HoodieUploader = (hoodie) => `
                <div class="bg-gray-800 p-4 rounded-lg text-center border border-gray-700">
                    <h3 class="font-semibold text-white mb-2">${hoodie.name}</h3>
                    <div id="setup-uploader-${hoodie.id}" class="aspect-square w-full bg-gray-700/50 border-2 border-dashed border-gray-600 rounded-lg flex items-center justify-center cursor-pointer hover:border-brand-green-light transition-colors">
                        <input type="file" data-hoodie-id="${hoodie.id}" class="setup-hoodie-input hidden" accept="image/jpeg,image/png,image/webp"/>
                        ${hoodie.image ? `
                            <img src="${hoodie.image}" alt="${hoodie.name} preview" class="object-cover w-full h-full rounded-lg" />
                        ` : `
                            <div class="text-gray-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                </svg>
                                <p class="mt-2 text-sm font-semibold">Click to Upload</p>
                            </div>
                        `}
                    </div>
                </div>`;
            
            return `
                <div id="setup-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 ${state.isSetupModalOpen ? '' : 'hidden'}">
                    <div class="max-w-4xl w-full mx-auto bg-gray-900 p-6 sm:p-8 rounded-2xl border border-gray-700 shadow-2xl">
                        <h1 class="text-3xl sm:text-4xl font-bold text-center text-white">Hoodie Image Setup</h1>
                        <p class="text-center text-gray-400 mt-2 mb-8 max-w-2xl mx-auto">
                           You can upload a reference image for each hoodie color. This will be saved in your browser for future use.
                        </p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${state.hoodies.map(HoodieUploader).join('')}
                        </div>
                        <div class="text-center mt-8">
                            <button id="close-setup-modal-btn" class="bg-brand-green-light text-white font-bold py-2 px-6 rounded-lg hover:bg-green-500 transition-colors">Done</button>
                        </div>
                    </div>
                </div>`;
        };

        // --- EVENT HANDLERS ---
        const handleFaceImageUpload = (file) => {
            if (file) {
                const reader = new FileReader();
                reader.onloadend = async () => {
                    try {
                        const resizedImage = await imageResizer(reader.result, 1024, 1024);
                        state.uploadedImage = resizedImage;
                    } catch (error) {
                        console.error("Error resizing image:", error);
                        state.uploadedImage = reader.result; // Fallback
                    }
                    render();
                };
                reader.readAsDataURL(file);
            }
        };
        
        const handleHoodieImageUpload = (hoodieId, file) => {
            if(file) {
                const reader = new FileReader();
                reader.onloadend = async () => {
                    try {
                        const resized = await imageResizer(reader.result, 1024, 1024);
                        const hoodie = state.hoodies.find(h => h.id === hoodieId);
                        if(hoodie) hoodie.image = resized;
                    } catch(e) {
                        console.error("Error resizing hoodie image", e);
                        const hoodie = state.hoodies.find(h => h.id === hoodieId);
                        if(hoodie) hoodie.image = reader.result;
                    }
                    saveHoodiesToLocalStorage();
                    render();
                }
                reader.readAsDataURL(file);
            }
        };

        const handleGenerate = async () => {
            if (!state.uploadedImage) {
                state.error = "Please upload an image first.";
                render();
                return;
            }

            const selectedHoodie = state.hoodies.find(h => h.id === state.selectedColor);
            if (!selectedHoodie?.image) {
                state.error = "Hoodie reference image is missing. Please use 'Customize' to set it up.";
                state.isSetupModalOpen = true;
                render();
                return;
            }

            state.isLoading = true;
            state.error = null;
            state.generatedImage = null;
            render();

            try {
                const result = await generatePortrait(state.uploadedImage, selectedHoodie.image, state.customPrompt);
                state.generatedImage = result;
            } catch (err) {
                state.error = err.toString();
            } finally {
                state.isLoading = false;
                render();
            }
        };

        // --- LOCAL STORAGE ---
        const saveHoodiesToLocalStorage = () => {
            try {
                localStorage.setItem('hoodies', JSON.stringify(state.hoodies));
            } catch (e) {
                console.error("Failed to save hoodies to localStorage", e);
                state.error = "Could not save settings. Your browser might be in private mode.";
                render();
            }
        };

        const loadHoodiesFromLocalStorage = () => {
            try {
                const savedHoodies = localStorage.getItem('hoodies');
                if (savedHoodies) {
                    const parsedHoodies = JSON.parse(savedHoodies);
                    state.hoodies = INITIAL_HOODIES.map(initial => {
                        const saved = parsedHoodies.find(h => h.id === initial.id);
                        return saved?.image ? { ...initial, image: saved.image } : initial;
                    });
                }
            } catch (e) {
                console.error("Failed to load hoodies from localStorage", e);
            }
        };

        // --- INITIALIZATION & EVENT LISTENERS ---
        const addEventListeners = () => {
            document.getElementById('image-uploader-box')?.addEventListener('click', () => document.getElementById('face-image-input').click());
            document.getElementById('face-image-input')?.addEventListener('change', (e) => handleFaceImageUpload(e.target.files[0]));
            document.querySelectorAll('.color-select-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.selectedColor = btn.dataset.color;
                    render();
                });
            });
            document.getElementById('custom-prompt')?.addEventListener('input', (e) => state.customPrompt = e.target.value);
            document.getElementById('generate-button')?.addEventListener('click', handleGenerate);
            document.getElementById('customize-hoodies-btn')?.addEventListener('click', () => {
                state.isSetupModalOpen = true;
                render();
            });
            document.getElementById('close-setup-modal-btn')?.addEventListener('click', () => {
                state.isSetupModalOpen = false;
                render();
            });
            document.querySelectorAll('.setup-hoodie-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    handleHoodieImageUpload(e.target.dataset.hoodieId, e.target.files[0]);
                });
            });
             document.querySelectorAll('[id^="setup-uploader-"]').forEach(box => {
                box.addEventListener('click', () => box.querySelector('input').click());
            });
        };

        // --- APP START ---
        loadHoodiesFromLocalStorage();
        render();
    </script>
  </body>
</html>
